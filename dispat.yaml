# One root manifest. Dispat runs this package's scripts from src/.
scripts:
  version: cd .. && bash scripts/docker.sh version
  build: cd .. && bash scripts/docker.sh build
  tests: cd .. && bash scripts/docker.sh tests
  verify-artifact: cd .. && bash scripts/docker.sh verify-artifact
  publish: cd .. && bash scripts/docker.sh publish
  released: cd .. && bash scripts/docker.sh released

packages:
  crier:
    path: src
    tagFormat: v{version}
    changelog:
      enabled: true
      file: ../CHANGELOG.md
    autoVersion:
      enabled: true
      manifests: none
    flow:
      version: version
      build: build
      postBuild: tests
      beforePublish: verify-artifact
      publish: publish
      postPublish: released

commit:
  enabled: true
  push: true
  name: github-actions[bot]
  email: github-actions[bot]@users.noreply.github.com
  include: [package.json, pnpm-lock.yaml, CHANGELOG.md]

github:
  enabled: true
  allPackages: true
  owner: yohimik
  repo: crier-npm
  footer:
    - line: ["---", ""]
    - line:
        - "[Install @dispat/crier from npm](https://www.npmjs.com/package/@dispat/crier/v/${DISPAT_NEW_VERSION})"
