name: Full suite
on:
  workflow_call:
    inputs:
      binary-version:
        type: string
        default: '1.1.1'
permissions:
  contents: read
env:
  CRIER_BINARY_VERSION: ${{ inputs.binary-version }}
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  pnpm_config_verify_deps_before_run: 'false'

jobs:
  tests:
    name: Tests / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['20.17.0', '22.9.0', '24.18.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - name: Exercise npm script approvals
        if: matrix.node == '24.18.0'
        run: npm install --global --ignore-scripts npm@12.0.1
      - name: Run the complete suite, regardless of changed files
        run: pnpm exec dispat run tests --since all
      - name: Keep coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.node }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Build and exercise the npm artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: npm install --global --ignore-scripts npm@12.0.1
      - run: pnpm exec dispat run build --since all
      - run: pnpm exec dispat run verify-artifact --since all
      - run: pnpm exec dispat run artifact-tests --since all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  install:
    name: Install / ${{ matrix.os }}
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-14, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: npm install --global --ignore-scripts npm@12.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: dist
      - name: Check npm and pnpm installations
        shell: bash
        run: bash scripts/check-install.sh dist/*.tgz
