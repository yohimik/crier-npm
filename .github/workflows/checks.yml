name: Full suite
on:
  workflow_call:
    inputs:
      binary-version:
        type: string
        default: '1.1.1'
permissions:
  contents: read
env:
  CRIER_BINARY_VERSION: ${{ inputs.binary-version }}
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  pnpm_config_verify_deps_before_run: 'false'
jobs:
  tests:
    name: Build and test the package in Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3.1.0
      # Named-script sweeps do not invoke release hooks. Run both, in order.
      - run: pnpm exec dispat run build --since all
      - run: pnpm exec dispat run tests --since all
      - run: pnpm exec dispat run verify-artifact --since all
      - name: Keep coverage and the tested artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-checks
          path: |
            .release/
            coverage/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
