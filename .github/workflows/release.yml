name: Release
on:
  workflow_dispatch:
    inputs:
      binary-version:
        description: Exact published native Crier version to wrap
        type: string
        default: '1.1.1'
        required: true
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
env:
  GIT_TERMINAL_PROMPT: '0'
  GIT_ASKPASS: ''
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  pnpm_config_verify_deps_before_run: 'false'

jobs:
  plan:
    name: Is there anything to release
    runs-on: ubuntu-latest
    outputs:
      releasing: ${{ steps.status.outputs.releasing }}
    steps:
      - name: Require main for releases
        if: github.ref != 'refs/heads/main'
        run: |
          echo 'Release from main after review.' >&2
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Compute the read-only plan
        id: status
        run: |
          rc=0
          pnpm exec dispat status --require-release || rc=$?
          case "$rc" in
            0) echo 'releasing=true' >> "$GITHUB_OUTPUT" ;;
            3)
              echo 'releasing=false' >> "$GITHUB_OUTPUT"
              echo 'Nothing to release; publication was skipped.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) exit "$rc" ;;
          esac

  release:
    name: Run dispat, publish binaries
    needs: plan
    if: needs.plan.outputs.releasing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    outputs:
      npm-released: ${{ steps.dispat.outputs.npm-released }}
      npm-version: ${{ steps.dispat.outputs.npm-version }}
      npm-binary-version: ${{ steps.dispat.outputs.npm-binary-version }}
    env:
      CRIER_BINARY_VERSION: ${{ inputs.binary-version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3.1.0
      - name: Configure an optional first-publication token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            umask 077
            # npm expands the reference at runtime; the token itself is not written.
            # shellcheck disable=SC2016
            printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$RUNNER_TEMP/crier-npmrc"
            echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/crier-npmrc" >> "$GITHUB_ENV"
          fi
      - name: Release through the pinned development dependency
        id: dispat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm exec dispat release --log-format json
      - name: Keep the release artifact and integrity record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-package
          path: |
            .release/
            coverage/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  post-release:
    name: Check published npm installation / ${{ matrix.os }}
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.npm-released == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-14, windows-latest, windows-11-arm]
    steps:
      # Read the helper from the exact reviewed revision. If npm succeeded but
      # recording failed, a release tag may not exist yet; still verify npm.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
      - run: npm install --global --ignore-scripts npm@12.0.1
      - name: Wait for this exact npm version
        timeout-minutes: 6
        shell: bash
        env:
          NPM_VERSION: ${{ needs.release.outputs.npm-version }}
        run: |
          node --input-type=module <<'NODE'
          import { waitForNpm } from './src/scripts/wait-for-npm.ts'
          await waitForNpm(process.env.NPM_VERSION)
          NODE
      - name: Install and verify the published package
        timeout-minutes: 8
        shell: bash
        env:
          NPM_VERSION: ${{ needs.release.outputs.npm-version }}
          BINARY_VERSION: ${{ needs.release.outputs.npm-binary-version }}
        run: |
          npm install --global --prefer-online --allow-scripts=@dispat/crier "@dispat/crier@$NPM_VERSION"
          crier --version | awk -v expected="$BINARY_VERSION" '
            $1 == "crier" && $2 == expected { found=1 }
            END { exit found ? 0 : 1 }
          '
          crier --help
