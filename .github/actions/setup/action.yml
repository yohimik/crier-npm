name: Set up release tools
description: Install pinned pnpm dependencies and the development dependency's verified Dispat binary
inputs:
  node-version:
    description: Node.js version
    default: '24.18.0'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}
    - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      # Reads packageManager from package.json, including on older Node versions.
      with:
        run_install: false
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts
    - name: Install the development dependency's Dispat binary
      shell: bash
      run: node node_modules/@dispat/bin/build/bin/postinstall.js
    - name: Verify the local release driver
      shell: bash
      run: pnpm exec dispat --version
